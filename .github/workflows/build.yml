# Builds the astroenvs binaries on every push and pull request.
# Pushing a tag like v1.2.0 also publishes them as a GitHub Release, which
# ipynb_setup.bash downloads from (releases/latest).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The sandbox test needs unprivileged user namespaces, which Ubuntu 24.04 restricts by
      # default through AppArmor (the lab server doesn't). CGO_ENABLED=0 as in the release
      # builds: dropping privileges on every thread (AllThreadsSyscall) doesn't work with cgo
      - name: Test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # A venv made like the setup's ~/.ipynb (uv's own Python, in the home folder), for
          # the end-to-end test of a sandboxed JupyterLab
          curl -LsSf https://astral.sh/uv/install.sh | sh
          UV_PYTHON_PREFERENCE=only-managed uv venv --python 3.13 ~/.ipynb
          uv pip install --python ~/.ipynb/bin/python jupyterlab
          CGO_ENABLED=0 ASTROENVS_SANDBOX_TEST=1 ASTROENVS_TEST_VENV=~/.ipynb go test -v ./...

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            # Static binaries, so they run on the cluster without any libraries
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/astroenvs-$os-$arch" ./cmd/astroenvs
          done
          (cd dist && sha256sum astroenvs-* > checksums.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: astroenvs
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
